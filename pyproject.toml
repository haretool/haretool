[project]
name = "haretool"
version = "0.1.0"
description = "Aide visuelle pour le combat contre le Comte Harebourg (Dofus 3), par lecture du trafic réseau."
requires-python = ">=3.12"
dependencies = ["PySide6"]

[project.optional-dependencies]
dev = ["pytest", "pyinstaller"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
